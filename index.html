<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8bcf32">
  <title>I Spy With My Little Eye</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <div class="question-card" id="questionCard" aria-live="polite">
        <span class="question-lead">I spy with my little eye something...</span>
        <span class="color-word" id="colorWord">YELLOW!</span>
      </div>
      <div class="status-bar">
        <span class="progress" id="progress">Found: 0 / 26</span>
        <button class="sound-button" id="soundButton" type="button" aria-pressed="true">
          <span aria-hidden="true" id="soundIcon">🔊</span>
          <span id="soundLabel">Music &amp; sound on</span>
        </button>
      </div>
    </header>

    <section class="scene-frame" aria-label="I Spy picture">
      <div class="scene" id="scene">
        <img id="sceneImage" src="assets/scene.png" alt="A colorful woodland scene with animals, fruit, flowers and a pond" draggable="false">
        <svg id="gameOverlay" class="game-overlay" viewBox="0 0 1408 768" preserveAspectRatio="xMidYMid meet" aria-label="Selectable objects">
          <defs id="svgDefs">
            <filter id="grayscale-filter">
              <feColorMatrix type="saturate" values="0"></feColorMatrix>
            </filter>
          </defs>
          <g id="foundLayer" aria-hidden="true"></g>
          <g id="hotspotLayer"></g>
          <g id="debugLabelLayer" aria-hidden="true"></g>
        </svg>
        <div class="loading" id="loading" role="status">Loading the picture…</div>
      </div>
    </section>

    <p class="helper-text">Look carefully and tap an object that matches the color!</p>
  </main>

  <div class="modal-backdrop" id="letterModal" hidden>
    <section class="letter-dialog" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
      <button class="close-button" id="closeModal" type="button" aria-label="Close">×</button>
      <p class="letter-title" id="letterTitle">Name this letter!</p>
      <div class="letter" id="letter" aria-live="assertive">A</div>
      <p class="letter-hint">Say it out loud, then close the window.</p>
    </section>
  </div>

  <div class="modal-backdrop" id="winModal" hidden>
    <section class="win-dialog" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <div class="stars" aria-hidden="true">★ ✦ ★</div>
      <h1 id="winTitle">Great job!</h1>
      <p>You found everything!</p>
      <p class="win-score" id="winScore">26 objects</p>
      <button class="play-again" id="playAgain" type="button">Play again</button>
    </section>
  </div>

  <audio id="backgroundMusic" src="assets/Foxglove%20Trail.mp3" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
